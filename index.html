
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOTTERY BET | CRASH</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090711;color:#fff;
 font-family:Tahoma,Arial,sans-serif;
 background-image:radial-gradient(ellipse at top,#30204d 0%,#090711 65%);
}
header{
 padding:22px 14px;text-align:center;
 border-bottom:1px solid #d6a73b55;
 background:#100c1b;
}
.logo{font-size:27px;font-weight:bold;color:#ffd76a;text-shadow:0 0 18px #d99b2c}
.subtitle{color:#bca9d8;font-size:12px;margin-top:8px}
.container{max-width:850px;margin:20px auto;padding:12px}
.panel{
 background:linear-gradient(145deg,#1b1429,#100d19);
 border:1px solid #a878d755;border-radius:20px;
 padding:18px;margin-bottom:16px;
 box-shadow:0 0 25px #8c35d522;
}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stat{
 flex:1;min-width:125px;background:#0c0914;
 border:1px solid #a77aff55;border-radius:14px;
 padding:13px;text-align:center
}
.stat small{color:#bba9d4}
.stat strong{display:block;color:#ffd76a;font-size:20px;margin-top:9px}
h2{color:#e4c4ff;text-align:center;margin:5px 0 18px}
#multiplier{
 font-size:65px;text-align:center;font-weight:bold;
 color:#ffd76a;text-shadow:0 0 25px #d99b2c;
 margin:25px 0 10px;
}
#status{text-align:center;color:#c9b9df;min-height:25px}
.graph{
 height:180px;background:#090711;border:1px solid #7650a0;
 border-radius:15px;position:relative;overflow:hidden;
 margin:18px 0;
}
#curve{
 position:absolute;left:0;bottom:0;width:100%;height:100%;
}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input{
 width:100%;padding:14px;border-radius:12px;
 border:1px solid #a77aff;background:#0b0812;
 color:white;font-size:17px;margin-top:8px
}
button{
 border:0;border-radius:13px;padding:16px;
 font-size:16px;font-weight:bold;cursor:pointer;
}
.start{background:linear-gradient(120deg,#ffe18a,#c58b24);color:#241500}
.cash{background:linear-gradient(120deg,#b56aff,#6425bd);color:white}
button:disabled{opacity:.4;cursor:not-allowed}
.history{width:100%;border-collapse:collapse;text-align:center}
.history td,.history th{padding:12px;border-bottom:1px solid #ffffff18}
.history th{color:#ffd76a}
.note{font-size:11px;color:#a99bb9;text-align:center;line-height:2}
@media(max-width:450px){
 #multiplier{font-size:52px}
 .controls{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
 <div class="logo">✦ LOTTERY BET ✦</div>
 <div class="subtitle">CRASH EXPERIENCE • نسخه آزمایشی</div>
</header>

<main class="container">
 <section class="panel">
  <div class="row">
   <div class="stat">
    <small>موجودی مجازی</small>
    <strong id="balance">1000</strong>
   </div>
   <div class="stat">
    <small>آخرین ضریب</small>
    <strong id="last">—</strong>
   </div>
  </div>
 </section>

 <section class="panel">
  <h2>🚀 بازی کراش</h2>
  <div id="multiplier">1.00x</div>
  <div id="status">برای شروع بازی آماده‌ای؟</div>
  <div class="graph">
   <svg id="curve" viewBox="0 0 600 180" preserveAspectRatio="none">
    <defs>
     <linearGradient id="glow">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ffd76a"/>
     </linearGradient>
    </defs>
    <path id="line" d="M0 170" fill="none"
     stroke="url(#glow)" stroke-width="5"
     stroke-linecap="round"/>
   </svg>
  </div>
  <div class="controls">
   <div>
    <label for="bet">مبلغ شرط مجازی</label>
    <input id="bet" type="number" min="1" max="1000" value="50">
   </div>
   <div>
    <label>ضریب فعلی</label>
    <input id="current" value="1.00x" readonly>
   </div>
   <button class="start" id="start">شروع بازی</button>
   <button class="cash" id="cash" disabled>برداشت جایزه</button>
  </div>
 </section>

 <section class="panel">
  <h2>📊 تاریخچه بازی‌ها</h2>
  <table class="history">
   <thead><tr><th>شماره</th><th>ضریب</th><th>نتیجه</th></tr></thead>
   <tbody id="history">
    <tr><td colspan="3">هنوز بازی‌ای انجام نشده است</td></tr>
   </tbody>
  </table>
 </section>
 <p class="note">
  این یک شبیه‌ساز نمایشی با اعتبار مجازی است.
  هیچ پول واقعی یا پرداختی در این صفحه وجود ندارد.
 </p>
</main>

<script>
let balance=1000;
let running=false;
let multiplier=1;
let bet=0;
let crashAt=2;
let timer=null;
let rounds=0;
let startTime=0;

const $=id=>document.getElementById(id);
function showBalance(){
 $("balance").textContent=balance.toFixed(0);
}
function endGame(won){
 running=false;
 clearInterval(timer);
 $("cash").disabled=true;
 $("start").disabled=false;
 $("last").textContent=multiplier.toFixed(2)+"x";

 if(won){
  const prize=bet*multiplier;
  balance+=prize;
  $("status").textContent="🎉 برداشت موفق! جایزه مجازی: "+prize.toFixed(0);
 }else{
  $("status").textContent="💥 کراش شد! این دور را باختی.";
 }
 showBalance();
 addHistory(multiplier,won);
}
function addHistory(value,won){
 rounds++;
 const body=$("history");
 if(rounds===1) body.innerHTML="";
 const tr=document.createElement("tr");
 [rounds,value.toFixed(2)+"x",won?"برد":"باخت"].forEach(v=>{
  const td=document.createElement("td");
  td.textContent=v;
  tr.appendChild(td);
 });
 body.prepend(tr);
}
function drawGraph(value){
 const x=Math.min(590,Math.max(10,(value-1)*100));
 const y=Math.max(12,165-Math.log(value)*65);
 const points=[];
 for(let i=0;i<=x;i+=5){
  const t=i/Math.max(x,1);
  const yy=165-Math.log(1+t*(value-1))*65;
  points.push((i*600/600)+","+yy);
 }
 $("line").setAttribute("d","M0 170 L"+points.join(" L"));
}
$("start").addEventListener("click",()=>{
 if(running)return;
 const amount=Number($("bet").value);
 if(!Number.isFinite(amount)||amount<1||amount>balance){
  $("status").textContent="مبلغ مجازی معتبر وارد کن.";
  return;
 }
 bet=amount;
 balance-=bet;
 showBalance();
 multiplier=1;
 crashAt=1.3+Math.random()*5;
 running=true;
 startTime=Date.now();
 $("start").disabled=true;
 $("cash").disabled=false;
 $("status").textContent="🚀 بازی شروع شد!";
 $("line").setAttribute("d","M0 170");
 $("current").value="1.00x";
 $("multiplier").textContent="1.00x";

 timer=setInterval(()=>{
  const seconds=(Date.now()-startTime)/1000;
  multiplier=Math.exp(seconds*.24);
  $("multiplier").textContent=multiplier.toFixed(2)+"x";
  $("current").value=multiplier.toFixed(2)+"x";
  drawGraph(multiplier);
  if(multiplier>=crashAt)endGame(false);
 },100);
});
$("cash").addEventListener("click",()=>{
 if(running)endGame(true);
});
showBalance();
</script>
</body>
</html>
