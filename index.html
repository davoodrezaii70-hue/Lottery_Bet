<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071b16">
<title>LOTTERY BET</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07130f;color:white;font-family:Tahoma,Arial,sans-serif}
header{background:#10291e;padding:22px 16px;text-align:center;border-bottom:2px solid #20bd70}
.logo{font-size:29px;font-weight:bold;color:#29dc83;letter-spacing:2px}
header p{color:#a8c7b6;font-size:12px}
nav{display:flex;overflow:auto;background:#102219;padding:12px;gap:10px}
nav button{white-space:nowrap;border:0;background:#234332;color:white;padding:12px 17px;border-radius:9px}
nav button.active{background:#20bd70;color:#061b10;font-weight:bold}
.container{padding:15px}
h3{color:#31db83}
.balance{background:linear-gradient(120deg,#145b37,#10291e);padding:18px;border-radius:13px;margin-bottom:20px}
.balance strong{font-size:24px;color:#3aff9a}
.match{background:#13271e;border:1px solid #294536;border-radius:13px;padding:15px;margin-bottom:13px}
.match-top{display:flex;justify-content:space-between;color:#a9c5b5;font-size:12px}
.teams{text-align:center;font-size:17px;font-weight:bold;margin:18px 0}
.options{display:flex;gap:8px}
.options button{flex:1;background:#234333;border:1px solid #345a43;color:white;padding:12px 5px;border-radius:8px}
.options button.selected{background:#21c879;color:#071b10;font-weight:bold}
.small{font-size:11px;color:#9db7a7}
#selected{background:#10291e;padding:15px;border-radius:12px;margin-top:20px}
.action{width:100%;border:0;border-radius:9px;background:#20bd70;color:#062015;padding:14px;font-weight:bold;font-size:15px;margin-top:12px}
footer{text-align:center;color:#819b8a;padding:25px;font-size:11px}
</style>
</head>
<body>
<header>
<div class="logo">LOTTERY BET</div>
<p>دنیای هیجان ورزش</p>
</header>

<nav>
<button class="active" onclick="showSport('همه',this)">همه</button>
<button onclick="showSport('فوتبال',this)">⚽ فوتبال</button>
<button onclick="showSport('بسکتبال',this)">🏀 بسکتبال</button>
<button onclick="showSport('تنیس',this)">🎾 تنیس</button>
<button onclick="showSport('والیبال',this)">🏐 والیبال</button>
</nav>

<div class="container">
<div class="balance">
<div>امتیاز نمایشی شما</div>
<strong id="points">1000</strong>
<p class="small">این امتیاز واقعی یا قابل برداشت نیست.</p>
</div>

<h3>🏆 مسابقات ورزشی</h3>
<div id="matches"></div>

<div id="selected">
<h3>🎯 انتخاب‌های من</h3>
<div id="choices">هنوز انتخابی ثبت نشده است.</div>
<button class="action" onclick="submitChoices()">ثبت انتخاب نمایشی</button>
</div>
</div>

<footer>
LOTTERY BET © 2026<br>
نسخه آزمایشی اپلیکیشن
</footer>

<script>
const games=[
{sport:'فوتبال',a:'رئال مادرید',b:'بارسلونا',time:'امروز - 20:00'},
{sport:'فوتبال',a:'منچسترسیتی',b:'لیورپول',time:'امروز - 22:00'},
{sport:'بسکتبال',a:'لس‌آنجلس لیکرز',b:'شیکاگو بولز',time:'فردا - 19:00'},
{sport:'تنیس',a:'بازیکن اول',b:'بازیکن دوم',time:'فردا - 17:00'},
{sport:'والیبال',a:'ایران',b:'برزیل',time:'فردا - 21:00'}
];
let picks={};

function render(filter='همه'){
let list=document.getElementById('matches');
list.innerHTML='';
games.filter(g=>filter==='همه'||g.sport===filter).forEach((g,i)=>{
let id=games.indexOf(g);
list.innerHTML+=`
<div class="match">
<div class="match-top"><span>${g.sport}</span><span>${g.time}</span></div>
<div class="teams">${g.a}　 VS　 ${g.b}</div>
<div class="options">
<button class="${picks[id]==='1'?'selected':''}" onclick="pick(${id},'1')">برد اول</button>
<button class="${picks[id]==='X'?'selected':''}" onclick="pick(${id},'X')">مساوی</button>
<button class="${picks[id]==='2'?'selected':''}" onclick="pick(${id},'2')">برد دوم</button>
</div>
</div>`;
});
}
function showSport(s,btn){
document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
render(s);
}
function pick(id,value){
picks[id]=value;
let active=document.querySelector('nav button.active');
let filter=active.textContent==='همه'?'همه':active.textContent.replace(/[^\u0600-\u06FF]/g,'');
render(filter);
updateChoices();
}
function updateChoices(){
let c=document.getElementById('choices');
let keys=Object.keys(picks);
c.innerHTML=keys.length?keys.map(k=>games[k].a+' - '+games[k].b+': '+picks[k]).join('<br>'):'هنوز انتخابی ثبت نشده است.';
}
function submitChoices(){
if(!Object.keys(picks).length){
alert('ابتدا یک مسابقه انتخاب کن');
return;
}
alert('انتخاب‌های نمایشی شما ثبت شد!');
}
render();
</script>
</body>
</html>
