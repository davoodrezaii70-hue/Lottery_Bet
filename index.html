
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LotteryBet - Crash</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#090f1d;
 color:white;
 font-family:Tahoma,Arial;
 padding:15px;
}
.container{max-width:900px;margin:auto}
header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:15px;
 background:#15243a;
 border-radius:15px;
 margin-bottom:15px;
}
.logo{font-size:23px;font-weight:bold;color:#20d69a}
.balance{font-size:14px}
.card{
 background:#142238;
 padding:15px;
 border-radius:16px;
 margin-bottom:15px;
}
.chart{
 height:280px;
 background:#0b1729;
 border:1px solid #29415e;
 border-radius:12px;
 display:flex;
 justify-content:center;
 align-items:center;
 position:relative;
}
#multiplier{
 font-size:65px;
 font-weight:bold;
 color:#20d69a;
}
input{
 width:100%;
 padding:13px;
 margin-top:8px;
 background:#091321;
 border:1px solid #34506d;
 border-radius:9px;
 color:white;
 font-size:16px;
}
button{
 width:100%;
 padding:14px;
 border:0;
 border-radius:10px;
 margin-top:10px;
 background:#20d69a;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}
#cashout{background:#ffc65c}
button:disabled{opacity:.4}
.info{
 display:flex;
 justify-content:space-between;
 margin-top:15px;
 color:#b6c5da;
}
</style>
</head>
<body>
<div class="container">

<header>
 <div class="logo">LOTTERYBET</div>
 <div class="balance">
 موجودی: <b id="balance">1000</b> سکه
 </div>
</header>

<div class="card">
 <div class="chart">
  <div id="multiplier">1.00x</div>
 </div>

 <label>مبلغ بازی</label>
 <input id="bet" type="number" value="50" min="1">

 <label>ضریب برداشت خودکار</label>
 <input id="auto" type="number" placeholder="مثلاً 2">

 <button id="start" onclick="startGame()">شروع کراش</button>
 <button id="cashout" onclick="cashOut()" disabled>
 برداشت سود
 </button>

 <div class="info">
  <span>وضعیت:</span>
  <b id="status">آماده بازی</b>
 </div>
</div>

<div class="card">
 <h3>نتایج بازی</h3>
 <div id="history">هنوز نتیجه‌ای ثبت نشده</div>
</div>

</div>

<script>
let balance=1000;
let bet=0;
let multiplier=1;
let crashPoint=0;
let active=false;
let cashed=false;
let timer=null;
let startTime=0;

function update(){
 document.getElementById("balance").textContent=balance;
 document.getElementById("multiplier").textContent=
 multiplier.toFixed(2)+"x";
}

function startGame(){
 if(active)return;

 bet=Number(document.getElementById("bet").value);

 if(bet<1 || bet>balance){
  alert("مبلغ نامعتبر است");
  return;
 }

 balance-=bet;
 multiplier=1;
 cashed=false;
 active=true;

 crashPoint=Math.max(1.05,1-Math.log(Math.random())*2);
 startTime=Date.now();

 document.getElementById("start").disabled=true;
 document.getElementById("cashout").disabled=false;
 document.getElementById("status").textContent="در حال اجرا";

 update();
 gameLoop();
}

function gameLoop(){
 if(!active)return;

 multiplier=Math.exp((Date.now()-startTime)/1000*.35);

 if(multiplier>=crashPoint){
  multiplier=crashPoint;
  active=false;

  document.getElementById("cashout").disabled=true;
  document.getElementById("start").disabled=false;

  if(!cashed){
   document.getElementById("status").textContent="باخت!";
   addHistory("باخت در "+multiplier.toFixed(2)+"x");
  }

  update();
  return;
 }

 update();

 let auto=Number(document.getElementById("auto").value);

 if(!cashed && auto>1 && multiplier>=auto){
  cashOut();
  return;
 }

 timer=setTimeout(gameLoop,50);
}

function cashOut(){
 if(!active || cashed)return;

 cashed=true;

 let payout=Math.floor(bet*multiplier);
 let profit=payout-bet;

 balance+=payout;
 document.getElementById("cashout").disabled=true;
 document.getElementById("status").textContent=
 "برد! سود: "+profit+" سکه";

 addHistory("برد در "+multiplier.toFixed(2)+"x");

 update();
}

function addHistory(text){
 let h=document.getElementById("history");
 if(h.textContent.includes("هنوز نتیجه")){
  h.textContent="";
 }
 let item=document.createElement("p");
 item.textContent=text;
 h.prepend(item);
}
update();
</script>
</body>
</html>
